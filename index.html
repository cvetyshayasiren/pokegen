<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ПОКЕГЕН · плёночный пиксель-арт</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/press-start-2p@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/600.css">
<style>
:root{--bg:#06080f;--bg2:#0a0f1b;--surf:#0f1626;--surf2:#15203a;--line:#22304f;
--txt:#eef2fb;--dim:#8d9abd;--gold:#e8c25a;--teal:#2fb3a8;--cyan:#35e0ff;--red:#e0453f;
--mag:#ff4fd8;--pink:#ff5fa8;--rust:#c4662c;--green:#5ef2a0;--rc:#8a93b8;--ink:#04060d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--txt);font-family:'Golos Text',system-ui,sans-serif;height:100dvh}
body::before{content:'';position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(80px);opacity:.42;
background:radial-gradient(34% 28% at 14% 10%,rgba(47,179,168,.55),transparent 70%),
radial-gradient(30% 26% at 88% 14%,rgba(255,95,168,.40),transparent 70%),
radial-gradient(38% 32% at 72% 90%,rgba(232,194,90,.26),transparent 70%),
radial-gradient(28% 24% at 20% 86%,rgba(196,102,44,.26),transparent 70%);
animation:drift 32s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate3d(-2%,-1%,0) scale(1)}100%{transform:translate3d(2%,2%,0) scale(1.08)}}
body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.04;
background:repeating-linear-gradient(to bottom,#fff 0 1px,transparent 1px 3px)}
.app{position:relative;z-index:2;height:100dvh;display:flex;flex-direction:column}
.top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);
background:linear-gradient(180deg,rgba(10,15,27,.95),rgba(10,15,27,.7));backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.bt{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--gold);white-space:nowrap;
text-shadow:0 2px 0 #5c3a12,0 0 16px rgba(232,194,90,.35)}
.bs{font-size:10px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.ic{width:36px;height:36px;display:grid;place-items:center;background:var(--surf);color:var(--txt);
border:1px solid var(--line);cursor:pointer;transition:.14s;padding:0}
.ic:hover{background:var(--surf2);border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
.ic:active{transform:translateY(1px)}
.ic.off{color:#5d688a;border-color:#1b2440}
.mode{font-family:'Press Start 2P',monospace;font-size:8.5px;padding:0 12px;height:36px;background:var(--surf);
border:1px solid var(--line);color:var(--dim);cursor:pointer;transition:.14s;white-space:nowrap}
.mode:hover{color:var(--txt);border-color:var(--teal)}
.mode.on{background:linear-gradient(180deg,#2fb3a8,#1c7f77);color:#04140f;border-color:var(--ink)}
.ic:focus-visible,.mode:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.body{flex:1 1 auto;min-height:0;display:flex}
.stage{flex:1 1 auto;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.frame{position:relative;background:#05070e;border:2px solid var(--ink);overflow:hidden;
box-shadow:0 0 0 1px var(--rc),0 14px 40px rgba(0,0,0,.6),0 0 60px rgba(53,224,255,.07)}
.frame.pop{animation:pop .5s cubic-bezier(.2,1.25,.4,1)}
@keyframes pop{0%{transform:scale(.97);opacity:.4}60%{transform:scale(1.006)}100%{transform:none;opacity:1}}
.frame.rar3{box-shadow:0 0 0 2px var(--rc),0 14px 44px rgba(0,0,0,.6),0 0 70px rgba(232,194,90,.26)}
#zoomw{position:absolute;inset:0;transform-origin:50% 62%;transition:transform .18s ease}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;cursor:pointer}
.scan{position:absolute;inset:0;pointer-events:none;opacity:.28;
background:repeating-linear-gradient(to bottom,rgba(0,0,0,.26) 0 1px,transparent 1px 3px)}
.hud{position:absolute;pointer-events:none}
.tl{left:8px;top:8px;max-width:54%}
.tr{right:8px;top:8px;max-width:42%;text-align:right}
.bl{left:8px;bottom:8px;max-width:calc(100% - 62px)}
.hname{font-family:'Press Start 2P',monospace;font-size:clamp(9px,2.3vmin,15px);line-height:1.35;
text-transform:uppercase;color:#fff;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.95);word-break:break-word}
.hsub{font-size:clamp(8px,1.4vmin,11px);color:#cfd8ee;margin-top:5px;text-shadow:0 1px 3px #000}
.frame.custom .tl{display:none}
.rar{font-family:'Press Start 2P',monospace;font-size:clamp(6px,1.1vmin,9px);color:var(--rc);
border:1px solid var(--rc);padding:4px 6px;background:rgba(4,6,13,.74);white-space:nowrap;display:inline-block}
.meta{font-family:'Press Start 2P',monospace;font-size:clamp(5.5px,1vmin,8px);line-height:1.5;color:#cbd6ee;
background:rgba(4,6,13,.7);border:1px solid rgba(255,255,255,.12);padding:4px 6px;margin-top:6px;display:inline-block}
.pill{font-family:'Press Start 2P',monospace;font-size:clamp(6px,1.1vmin,9px);line-height:1.5;
background:rgba(4,6,13,.74);border:1px solid rgba(255,255,255,.14);padding:5px 7px;color:#dfe6f7;display:inline-block}
.play{position:absolute;right:8px;bottom:8px;width:36px;height:36px;display:grid;place-items:center;
background:rgba(6,9,18,.78);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;transition:.15s;padding:0}
.play:hover{border-color:var(--cyan);color:var(--cyan);transform:scale(1.06)}
.play.off{border-color:var(--gold);color:var(--gold);background:rgba(20,14,4,.8)}
.bottom{flex:0 0 auto;padding:9px 12px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
background:linear-gradient(0deg,rgba(10,15,27,.97),rgba(10,15,27,.74));backdrop-filter:blur(8px)}
.grow{display:flex;gap:7px;align-items:stretch;max-width:840px;margin:0 auto}
#inp{flex:1 1 auto;min-width:0;background:#070b15;border:2px solid var(--line);color:var(--txt);
font-family:'Golos Text',sans-serif;font-size:16px;font-weight:600;padding:11px 13px;outline:none;transition:.15s}
#inp::placeholder{color:#58638a;font-weight:400}
#inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,194,90,.16)}
.gen{font-family:'Press Start 2P',monospace;font-size:10.5px;padding:0 16px;border:2px solid var(--ink);
background:linear-gradient(180deg,#f0574f,#c9302b);color:#fff;cursor:pointer;box-shadow:0 4px 0 #7d1a17;transition:.1s;white-space:nowrap}
.gen:hover{filter:brightness(1.1)}.gen:active{transform:translateY(3px);box-shadow:0 1px 0 #7d1a17}
.sq{width:48px;display:grid;place-items:center;border:2px solid var(--ink);cursor:pointer;transition:.1s;padding:0}
.dice{background:linear-gradient(180deg,#f2cf6a,#d8a72f);color:#2a1e05;box-shadow:0 4px 0 #8a6a12}
.info{background:linear-gradient(180deg,#3fd0c4,#1f8d84);color:#04140f;box-shadow:0 4px 0 #135b55}
.sq:hover{filter:brightness(1.09)}.sq:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.dice:hover svg{animation:roll .6s ease}
@keyframes roll{to{transform:rotate(360deg)}}
.hint{max-width:840px;margin:7px auto 0;font-size:10.5px;color:#6f7ba0;text-align:center;line-height:1.5}
.hint b{color:var(--teal);font-weight:600}
.gen:focus-visible,.sq:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.editor{display:none;flex:0 0 330px;width:330px;border-left:1px solid var(--line);background:var(--bg2);
overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#2b3a63 #0a0f1b}
.app.edit .editor{display:block}
.edhead{position:sticky;top:0;z-index:3;padding:11px 14px;font-family:'Press Start 2P',monospace;font-size:9px;
color:var(--teal);background:linear-gradient(180deg,#0c1322,#0a0f1b);border-bottom:1px solid var(--line)}
.edbody{padding:6px 14px 24px}
.eh{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--gold);margin:16px 0 8px;padding-bottom:6px;
border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.eh:first-child{margin-top:8px}
.eh i{font-family:'Golos Text',sans-serif;font-style:normal;font-size:9px;color:#5f6b90;margin-left:auto;letter-spacing:0}
.er{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid rgba(34,48,79,.45)}
.el{font-size:12px;color:var(--dim);width:108px;flex:0 0 auto;line-height:1.3}
.es{flex:1;min-width:0;background:#091020;color:var(--txt);border:1px solid var(--line);
font-family:'Golos Text',sans-serif;font-size:12px;font-weight:600;padding:6px 7px;outline:none;cursor:pointer}
.es:focus{border-color:var(--teal)}
.er input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:5px;background:#15203a;
border:1px solid var(--line);outline:none;cursor:pointer}
.er input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:17px;background:var(--teal);
border:1px solid var(--ink);cursor:pointer}
.er input[type=range]::-moz-range-thumb{width:12px;height:17px;background:var(--teal);border:1px solid var(--ink);cursor:pointer}
.er input[type=range]:hover::-webkit-slider-thumb{background:var(--cyan)}
.ev{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--gold);width:44px;text-align:right;flex:0 0 auto}
.ec{width:44px;height:26px;padding:0;border:1px solid var(--line);background:#091020;cursor:pointer;margin-left:auto}
.tog input{width:19px;height:19px;accent-color:var(--teal);cursor:pointer;margin-left:auto}
.editor::-webkit-scrollbar,.tbody::-webkit-scrollbar,.tabs::-webkit-scrollbar{width:10px;height:8px}
.editor::-webkit-scrollbar-track,.tbody::-webkit-scrollbar-track,.tabs::-webkit-scrollbar-track{background:#0a0f1b}
.editor::-webkit-scrollbar-thumb,.tbody::-webkit-scrollbar-thumb,.tabs::-webkit-scrollbar-thumb{background:#2b3a63;border:2px solid #0a0f1b}
.editor::-webkit-scrollbar-thumb:hover,.tbody::-webkit-scrollbar-thumb:hover{background:var(--teal)}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
background:rgba(4,6,13,.8);backdrop-filter:blur(6px);padding:14px}
.modal.on{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{width:min(700px,100%);max-height:86dvh;display:flex;flex-direction:column;background:var(--surf);
border:2px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.7)}
.phead2{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);
background:linear-gradient(120deg,rgba(47,179,168,.16),rgba(255,95,168,.14))}
.ptitle{font-family:'Press Start 2P',monospace;font-size:10px}
.pclose{margin-left:auto;width:30px;height:30px;background:var(--surf2);border:1px solid var(--line);
color:var(--dim);cursor:pointer;font-size:15px;display:grid;place-items:center}
.pclose:hover{color:var(--red);border-color:var(--red)}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg2);scrollbar-width:thin}
.tab{flex:0 0 auto;font-family:'Press Start 2P',monospace;font-size:8px;padding:11px;background:none;border:none;
border-bottom:2px solid transparent;color:#7c88ad;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);background:rgba(232,194,90,.07)}
.tbody{padding:13px 16px 20px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2b3a63 #0a0f1b}
.hh{font-family:'Press Start 2P',monospace;font-size:8.5px;color:var(--teal);margin:15px 0 8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.hh:first-child{margin-top:0}
.row2{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(34,48,79,.45)}
.k{color:var(--dim);flex:0 0 auto}.v{font-weight:600;text-align:right;overflow-wrap:anywhere}
.sws{display:flex;gap:4px}.sws i{width:16px;height:16px;border:1px solid var(--ink);display:block}
.stat{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px}
.stat .k{width:68px}.cells{display:flex;gap:2px;flex:1}
.cells i{flex:1;height:11px;background:#15203a;border:1px solid var(--ink)}
.sv{font-family:'Press Start 2P',monospace;font-size:8px;width:26px;text-align:right}
.btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.mini{font-family:'Press Start 2P',monospace;font-size:8px;padding:10px 11px;background:var(--surf2);
border:1px solid var(--line);color:var(--txt);cursor:pointer}
.mini:hover{border-color:var(--cyan);color:var(--cyan)}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip2{font-family:'Golos Text',sans-serif;font-size:12.5px;font-weight:600;padding:6px 10px;background:var(--bg2);
border:1px solid var(--line);color:var(--dim);cursor:pointer}
.chip2.on{color:var(--gold);border-color:var(--gold)}
.note{font-size:12.5px;line-height:1.65;color:var(--dim);margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,12px);z-index:60;background:var(--surf);
border:2px solid var(--gold);color:var(--txt);font-family:'Press Start 2P',monospace;font-size:8px;line-height:1.6;
padding:11px 15px;opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.warn{border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s}
@media (max-width:1099px){.body{flex-direction:column}
.editor{flex:0 0 auto;width:auto;max-height:44dvh;border-left:none;border-top:1px solid var(--line)}
.stage{min-height:150px}.el{width:100px}}
@media (max-width:520px){.bs{display:none}.bt{font-size:10px}.ic{width:32px;height:32px}
.mode{font-size:7.5px;padding:0 9px;height:32px}.gen{font-size:9px;padding:0 11px}.sq{width:42px}
#inp{font-size:15px;padding:10px 11px}.hint{font-size:9.5px}}
@media (max-height:560px){.hint{display:none}.top{padding:5px 10px}.bottom{padding:6px 10px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top">
 <div class="brand">
  <svg width="25" height="25" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true">
   <rect x="3" y="0" width="4" height="1" fill="#04060d"/><rect x="2" y="1" width="6" height="1" fill="#04060d"/>
   <rect x="1" y="2" width="8" height="3" fill="#04060d"/><rect x="2" y="2" width="6" height="2" fill="#e0453f"/>
   <rect x="3" y="1" width="4" height="1" fill="#e0453f"/><rect x="1" y="5" width="8" height="3" fill="#04060d"/>
   <rect x="2" y="5" width="6" height="3" fill="#f2efe6"/><rect x="3" y="8" width="4" height="1" fill="#04060d"/>
   <rect x="0" y="4" width="10" height="1" fill="#04060d"/><rect x="4" y="3" width="2" height="3" fill="#04060d"/>
   <rect x="4" y="4" width="2" height="1" fill="#e8c25a"/></svg>
  <div><div class="bt">ПОКЕГЕН</div><div class="bs">55 миров · 44 покемона · 24 верха · 13 низа</div></div>
 </div>
 <div class="tools">
  <button id="bTrans" class="ic" type="button" title="Проиграть переход (T)">
   <svg width="17" height="17" viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor"><rect x="1" y="3" width="6" height="10"/><rect x="9" y="3" width="2" height="10" opacity=".65"/><rect x="13" y="3" width="2" height="10" opacity=".35"/></svg></button>
  <button id="bMode" class="mode" type="button">РЕДАКТОР</button>
  <button id="bSound" class="ic" type="button" title="Звук (M)">
   <svg id="icoOn" width="17" height="17" viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor"><rect x="2" y="6" width="3" height="4"/><polygon points="5,6 9,2 9,14 5,10"/><rect x="11" y="5" width="1" height="6"/><rect x="13" y="3" width="1" height="10"/></svg>
   <svg id="icoOff" style="display:none" width="17" height="17" viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor"><rect x="2" y="6" width="3" height="4"/><polygon points="5,6 9,2 9,14 5,10"/><rect x="10" y="7" width="6" height="1"/><rect x="12" y="5" width="1" height="5"/></svg></button>
  <button id="bPng" class="ic" type="button" title="Скачать PNG">
   <svg width="17" height="17" viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor"><rect x="7" y="2" width="2" height="7"/><polygon points="4,8 12,8 8,13"/><rect x="2" y="13" width="12" height="2"/></svg></button>
  <button id="bShare" class="ic" type="button" title="Ссылка">
   <svg width="17" height="17" viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor"><rect x="2" y="6" width="4" height="4"/><rect x="10" y="2" width="4" height="4"/><rect x="10" y="10" width="4" height="4"/><rect x="5" y="5" width="6" height="1"/><rect x="5" y="10" width="6" height="1"/></svg></button>
 </div>
</header>
<div class="body">
 <main class="stage" id="stage">
  <div class="frame" id="frame">
   <div id="zoomw"><canvas id="cv" width="288" height="384"></canvas></div>
   <div class="scan" id="scan"></div>
   <div class="hud tl"><div class="hname" id="hName">—</div><div class="hsub" id="hSub">—</div></div>
   <div class="hud tr"><span class="rar" id="hRar">—</span><br><span class="meta" id="hMeta">—</span></div>
   <div class="hud bl"><span class="pill" id="hLoc">—</span></div>
   <button id="bPlay" class="play" type="button" title="Пауза (пробел)">
    <svg id="icoPause" width="13" height="13" viewBox="0 0 12 12" shape-rendering="crispEdges" fill="currentColor"><rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/></svg>
    <svg id="icoPlay" style="display:none" width="13" height="13" viewBox="0 0 12 12" shape-rendering="crispEdges" fill="currentColor"><polygon points="2,1 11,6 2,11"/></svg></button>
  </div>
 </main>
 <aside class="editor" id="editor">
  <div class="edhead">РЕДАКТОР · ЖИВЫЕ НАСТРОЙКИ</div>
  <div class="edbody" id="edbody"></div>
 </aside>
</div>
<footer class="bottom">
 <div class="grow">
  <input id="inp" type="text" maxlength="26" autocomplete="off" spellcheck="false" placeholder="Имя тренера — например, Василёк">
  <button id="bGen" class="gen" type="button">СОЗДАТЬ</button>
  <button id="bDice" class="sq dice" type="button" title="Случайное имя (R)">
   <svg width="21" height="21" viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor"><rect x="1" y="1" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="4" width="2" height="2"/><rect x="10" y="4" width="2" height="2"/><rect x="7" y="7" width="2" height="2"/><rect x="4" y="10" width="2" height="2"/><rect x="10" y="10" width="2" height="2"/></svg></button>
  <button id="bInfo" class="sq info" type="button" title="Паспорт карточки (I)">
   <svg width="21" height="21" viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor"><rect x="7" y="2" width="2" height="2"/><rect x="7" y="6" width="2" height="8"/></svg></button>
 </div>
 <div class="hint">Имя — <b>сид</b>: мир, оптика, плёнка, гардероб и характер движения. <b>↑↓</b> история · <b>пробел</b> пауза · <b>T</b> переход · <b>I</b> паспорт · <b>E</b> редактор</div>
</footer>
</div>
<div class="modal" id="modal"><div class="panel">
 <div class="phead2"><span class="ptitle">ПАСПОРТ КАРТОЧКИ</span><button id="bClose" class="pclose" type="button">✕</button></div>
 <div class="tabs" id="tabs"></div><div class="tbody" id="tbody"></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";

 erange('Амплитуда движений',.3,1.8,.05,function(){return f.amp;},function(v){fxSet('amp',v);});
 erange('Дрейф камеры',0,3,.1,function(){return f.drift;},function(v){fxSet('drift',v);},
  function(v){return v.toFixed(1)+'px';});
 erange('Частота дрейфа',.02,.3,.01,function(){return f.driftSpd;},function(v){fxSet('driftSpd',v);},
  function(v){return v.toFixed(2);});
 etog('Дрожание плёнки',function(){return f.weave;},function(v){fxSet('weave',v?1:0);});
 erange('Тряска на грозе',0,2,.05,function(){return f.shake;},function(v){fxSet('shake',v);});
 erange('Плотность осадков',0,2,.05,function(){return f.weather;},function(v){fxSet('weather',v);});
 erange('Сила ветра',.2,2.5,.05,function(){return f.wind;},function(v){fxSet('wind',v);});
 erange('Плотность жизни',.2,1.8,.05,function(){return f.lifeDensity;},function(v){fxSet('lifeDensity',v);});
 erange('Мерцание / блики',.3,2.2,.05,function(){return f.twinkle;},function(v){fxSet('twinkle',v);});
 esel('Переход кадра',REVEALS,function(){return f.revealKind;},
  function(v){fxSet('revealKind',v);replayTransition();});
 erange('Длина перехода',200,1100,20,function(){return f.revealMs;},function(v){fxSet('revealMs',v);},
  function(v){return v+'мс';});
 var dp=document.createElement('div');dp.className='btnrow';
 var pb=document.createElement('button');pb.className='mini';pb.textContent='▶ ПРОИГРАТЬ';
 pb.onclick=function(){replayTransition();};
 var pn=document.createElement('button');pn.className='mini';pn.textContent='ДРУГОЙ ПЕРЕХОД';
 pn.onclick=function(){var i=REVEALS.map(function(r){return r[0];}).indexOf(S.fx.revealKind);
  S.fx.revealKind=REVEALS[(i+1)%REVEALS.length][0];afterEdit();buildEditor();replayTransition();
  toast('Переход: '+findName(REVEALS,S.fx.revealKind));};
 dp.appendChild(pb);dp.appendChild(pn);$('edbody').appendChild(dp);
 ehead('НЕ ЗАВИСИТ ОТ СИДА','ваше');
 erange('Скорость анимации',0,2.5,.05,function(){return CFG.dance;},function(v){CFG.dance=v;});
 erange('Приближение кадра',1,1.8,.02,function(){return CFG.zoom;},function(v){CFG.zoom=v;applyCss();});
 var d=document.createElement('div');d.className='btnrow';
 var r1=document.createElement('button');r1.className='mini';r1.textContent='СЛУЧАЙНО';r1.onclick=randomizeCard;
 var r2=document.createElement('button');r2.className='mini';r2.textContent='СБРОС К СИДУ';
 r2.onclick=function(){S.fx=cloneFX(S.fx0);SPR.key='';skyKey='';applyCss();Sound.update();
  S.custom=false;renderHud();buildEditor();replayTransition();toast('Эффекты возвращены к сиду');};
 var r3=document.createElement('button');r3.className='mini';r3.textContent='PNG';r3.onclick=exportPNG;
 d.appendChild(r1);d.appendChild(r2);d.appendChild(r3);b.appendChild(d);}
function randomizeCard(){
 var R2=RNG((Math.random()*4294967295)>>>0);
 S.loc=R2.p(LOCS);S.st=R2.p(STYLES);S.time=R2.p(TIMES);S.wea=R2.p(WEATHER).id;
 S.weaN=WEATHER.filter(function(w){return w.id===S.wea;})[0].n;
 S.pal=buildPal(S.st,S.time.id,S.wea);
 S.arr=R2.p(ARRANGE)[0];S.dir=R2.c(.5)?1:-1;S.camScale=R2.p([0,0,3,4,5]);S.camY=R2.i(-10,10);
 S.tr.x=R2.i(70,200);S.tr.motion=R2.p(MOTIONS);S.tr.hair=R2.p(HAIRS);S.tr.hat=R2.p(HATS)[0];
 var pool=OUTFIT[S.st.id]||[];
 S.tr.top=R2.c(.6)&&pool.length?byId(TOPS,R2.p(pool)):R2.p(TOPS);
 S.tr.bot=R2.p(BOTS);S.tr.shoe=R2.p(SHOES);S.tr.build=R2.i(0,4);
 S.tr.skin=tAdj(S.tr.skinRaw,S.time.id,.5);
 S.tr.face.eyes=R2.p(EYES)[0];S.tr.face.mouth=R2.p(MOUTHS)[0];
 S.tr.c1=R2.p(S.pal.cloth);S.tr.c2=R2.p(S.pal.cloth);S.tr.c3=R2.p(S.pal.neon);
 S.tr.hairC=R2.p(S.pal.hair);S.tr.shoeC=R2.p(S.pal.cloth);
 S.pk.def=R2.p(POKES);S.pk.motion=R2.p(MOTIONS);S.pk.dsz=R2.i(-1,1);
 S.pk.b=R2.p(S.pal.cloth);S.pk.s=mix(S.pk.b,'#ffffff',.42);S.pk.a=R2.p(S.pal.neon);S.pk.c=R2.p(S.pal.neon);
 S.pk.shiny=R2.c(.3);
 S.fx=buildFX(R2,S.st,S.loc,S.time,S.wea);S.fx0=cloneFX(S.fx);
 skyKey='';SPR.key='';Sound.update();applyCss();afterEdit();buildEditor();replayTransition();
 toast('Карточка пересобрана');}
function setEdit(v){editMode=v;app.classList.toggle('edit',v);
 $('bMode').classList.toggle('on',v);$('bMode').textContent=v?'РЕДАКТОР ✕':'РЕДАКТОР';
 if(v)buildEditor();setTimeout(fit,40);}
$('bMode').onclick=function(){Sound.init();setEdit(!editMode);Sound.blip(560);};
$('bTrans').onclick=function(){Sound.init();replayTransition();
 toast('Переход: '+findName(REVEALS,S.fx.revealKind));};
function renderHud(){
 $('hName').textContent=S.raw;
 $('hSub').textContent=S.tr.top[1]+' · '+S.tr.bot[1]+' · '+S.tr.motion[1];
 $('hRar').textContent=RARITY[S.rar].n;$('hRar').style.setProperty('--rc',RARITY[S.rar].c);
 $('hLoc').textContent=S.loc.n;
 $('hMeta').textContent=S.st.name+' · '+S.time.n+' · '+(S.loc.k==='out'?S.weaN:'внутри');
 frame.style.setProperty('--rc',RARITY[S.rar].c);
 frame.className='frame rar'+S.rar+(S.custom?' custom':'');
 document.title=(S.custom?'Своя карточка':S.raw)+' — ПОКЕГЕН · '+S.loc.n;}
function generate(name){
 name=String(name||'').trim().replace(/\s+/g,' ');
 if(!name){var i=$('inp');i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake');
  toast('Введите имя тренера','warn');i.focus();return;}
 if(name.length>26)name=name.slice(0,26);
 S=buildSpec(name);dt=0;revealT=performance.now();skyKey='';SPR.key='';errCount=0;
 renderHud();pushR(name);histIdx=-1;applyCss();
 try{window.history.replaceState(null,'','?n='+encodeURIComponent(name));}catch(e){}
 Sound.setSpec(S);Sound.arp();
 if(editMode)buildEditor();
 if($('modal').classList.contains('on'))renderTab();
 frame.classList.remove('pop');void frame.offsetWidth;frame.classList.add('pop');
 safe(function(){initFX();renderScene(sceneCtx,S,performance.now()/1000,0);postFX(ctx,S,0,[0,0]);});}
var SY1=['Пи','Ка','Чу','Буль','Скв','Ир','Мяу','Пси','Джи','Гар','Чар','Лу','Зо','Нео','Тер','Вольт','Маг','Кри','Фло','Юн','Мал','Не','Гри','Фон','Аль','Вас'];
var SY2=['ка','чу','зар','тир','мон','дон','ра','си','ло','нит','вор','глас','мир','зум','фан','тор','лёд','иск','ва','рий','нель','ша'];
var SY3=['','он','ик','ус','ар','ия','ок','ель','ыч','ёс','эн','ей'];
function randName(){function p(a){return a[Math.floor(Math.random()*a.length)];}return p(SY1)+p(SY2)+p(SY3);}
function exportPNG(){
 if(!S)return;
 var k=3,hh=118,fh=104;
 var c=document.createElement('canvas');c.width=W*k;c.height=hh+H*k+fh;
 var g=c.getContext('2d');g.imageSmoothingEnabled=false;
 function draw(){
  g.fillStyle='#0a0d16';g.fillRect(0,0,c.width,c.height);
  var gr=g.createLinearGradient(0,0,c.width,0);
  gr.addColorStop(0,S.pal.neon[0]);gr.addColorStop(.55,S.loc.k==='out'?S.pal.sky[2]:S.loc.bg[2]);
  gr.addColorStop(1,S.pal.neon[1]||S.pal.neon[0]);
  g.fillStyle=gr;g.fillRect(0,0,c.width,hh);
  g.fillStyle='rgba(8,11,20,.66)';g.fillRect(0,0,c.width,hh);
  g.textBaseline='top';
  var title=S.custom?'СВОЯ КАРТОЧКА':S.raw.toUpperCase(),fs=40;
  g.font=fs+'px "Press Start 2P",monospace';
  while(g.measureText(title).width>c.width-260&&fs>14){fs-=2;g.font=fs+'px "Press Start 2P",monospace';}
  g.fillStyle='#fff';g.fillText(title,26,26);
  g.font='15px "Press Start 2P",monospace';g.fillStyle='#cfd6ea';
  g.fillText(S.pk.def[0]+' · '+S.pk.def[1],26,26+fs+16);
  g.textAlign='right';g.fillStyle=RARITY[S.rar].c;g.font='16px "Press Start 2P",monospace';
  g.fillText(RARITY[S.rar].n,c.width-26,26);
  g.fillStyle='#9aa4c4';g.font='13px "Press Start 2P",monospace';
  g.fillText('#'+S.id+' · №'+S.num,c.width-26,54);g.textAlign='left';
  g.drawImage(cv,0,hh,W*k,H*k);
  var fy=hh+H*k;
  g.fillStyle='#0e1220';g.fillRect(0,fy,c.width,fh);
  g.font='15px "Press Start 2P",monospace';g.fillStyle=S.pal.neon[0];
  g.fillText(S.loc.n.toUpperCase(),26,fy+20);
  g.font='12px "Press Start 2P",monospace';g.fillStyle='#cfd6ea';
  g.fillText((S.st.name+' · '+S.time.n).toUpperCase(),26,fy+48);
  g.fillStyle='#7f89ab';g.fillText((S.custom?'РЕДАКТОР':'СИД '+S.hash)+' · '+S.mus.def.n.toUpperCase(),26,fy+72);
  g.strokeStyle=RARITY[S.rar].c;g.lineWidth=6;g.strokeRect(3,3,c.width-6,c.height-6);
  var a=document.createElement('a');
  a.download='pokegen-'+(S.custom?'custom':S.norm.replace(/[^a-zа-яё0-9]+/gi,'-'))+'.png';
  a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('PNG сохранён');}
 if(document.fonts&&document.fonts.load)
  Promise.all([document.fonts.load('40px "Press Start 2P"'),document.fonts.load('15px "Press Start 2P"')])
   .then(draw).catch(draw);else draw();}
function share(){if(!S)return;
 var url=location.href.split('?')[0]+(S.custom?'':'?n='+encodeURIComponent(S.raw));
 function ok(){toast('Ссылка скопирована');}
 function fb(){try{var t=document.createElement('textarea');t.value=url;t.style.position='fixed';
  t.style.opacity=0;document.body.appendChild(t);t.select();document.execCommand('copy');
  document.body.removeChild(t);ok();}catch(e){toast(url,'warn');}}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(ok).catch(fb);
 else fb();}
function applyCss(){if(!S)return;
 cv.style.filter='hue-rotate('+S.fx.hue+'deg) saturate('+S.fx.sat+')';
 $('zoomw').style.transform='scale('+CFG.zoom+')';$('scan').style.opacity=S.fx.scan?.28:0;}
function syncSound(){var on=Sound.isOn();$('bSound').classList.toggle('off',!on);
 $('icoOn').style.display=on?'':'none';$('icoOff').style.display=on?'none':'';}
function setPause(v){paused=v;$('bPlay').classList.toggle('off',v);
 $('icoPause').style.display=v?'none':'';$('icoPlay').style.display=v?'':'none';}
$('bGen').onclick=function(){Sound.init();generate($('inp').value);};
$('bDice').onclick=function(){Sound.init();var n=randName();$('inp').value=n;generate(n);Sound.blip(760);};
$('bInfo').onclick=function(){Sound.init();$('modal').classList.add('on');renderTab();Sound.blip(480);};
$('inp').addEventListener('keydown',function(e){
 if(e.key==='Enter'){Sound.init();generate(e.target.value);}
 else if(e.key==='ArrowUp'){e.preventDefault();histIdx=Math.min(recent.length-1,histIdx+1);
  if(recent[histIdx])e.target.value=recent[histIdx];}
 else if(e.key==='ArrowDown'){e.preventDefault();histIdx=Math.max(-1,histIdx-1);
  e.target.value=histIdx<0?'':recent[histIdx];}});
$('bSound').onclick=function(){Sound.init();Sound.toggle();syncSound();Sound.update();};
$('bPng').onclick=function(){Sound.init();exportPNG();};
$('bShare').onclick=function(){Sound.init();share();};
$('bPlay').onclick=function(){Sound.init();setPause(!paused);Sound.blip(400);};
cv.addEventListener('click',function(){Sound.init();setPause(!paused);});
document.addEventListener('keydown',function(e){
 var tag=(document.activeElement||{}).tagName,typing=tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA';
 if(e.key==='Escape'){$('modal').classList.remove('on');return;}
 if(typing)return;
 if(e.code==='Space'){e.preventDefault();Sound.init();setPause(!paused);}
 else if(e.key==='i'||e.key==='I'||e.key==='ш')$('bInfo').click();
 else if(e.key==='m'||e.key==='M'||e.key==='ь')$('bSound').click();
 else if(e.key==='r'||e.key==='R'||e.key==='к')$('bDice').click();
 else if(e.key==='e'||e.key==='E'||e.key==='у')$('bMode').click();
 else if(e.key==='t'||e.key==='T'||e.key==='е')$('bTrans').click();});
document.addEventListener('pointerdown',function once(){Sound.init();syncSound();
 document.removeEventListener('pointerdown',once);});
var lastFlash=-1;
function loop(now){
 var t=now/1000,d=Math.min(.05,t-prev);prev=t;
 if(!paused)dt+=d;
 if(S){initFX();
  try{renderScene(sceneCtx,S,t,dt);postFX(ctx,S,t,frameOffset(S,t));errCount=0;}
  catch(err){errCount++;if(errCount<6){fallback(sceneCtx);safe(function(){postFX(ctx,S,t,[0,0]);});}}
  var rv=Math.min(1,(now-revealT)/S.fx.revealMs);
  if(rv<1)safe(function(){revealMask(ctx,S,rv);});
  if(S.loc.k==='out'&&S.wea==='storm'&&FLASH.idx!==lastFlash&&FLASH.v>.5){
   lastFlash=FLASH.idx;Sound.thunder(FLASH.idx);}}
 requestAnimationFrame(loop);}
var init='Василёк';
try{var q=new URLSearchParams(location.search).get('n');if(q&&q.trim())init=q;}catch(e){}
$('inp').value=init;
syncSound();setPause(false);fit();
generate(init);
if(window.innerWidth>=1100)setEdit(true);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
requestAnimationFrame(loop);
})();
</script>
